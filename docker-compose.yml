  mongodb:
    container_name: user_messaging_mongo
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: user_messaging
    volumes:
      - mongo_data:/data/db

  rabbitmq:
    container_name: user_messaging_rabbitmq
    image: rabbitmq:3-management
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    restart: unless-stopped

volumes:
  mongo_data:
